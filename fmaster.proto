syntax = "proto3";

package fstore.master.v1;
option cc_generic_services = true;

enum Code {
  OK = 0;
  INVALID_ARGUMENT = 1;
  NOT_FOUND = 2;
  CONFLICT = 3;
  STORAGE_ERROR = 4;
}

message Status {
  Code code = 1;
  string message = 2;
}

message Disk {
  string id = 1;
  string path = 2;
  bool disabled = 3;
}

message FServer {
  string id = 1;
  string endpoint = 2;
  bool disabled = 3;
  repeated Disk disks = 4;
  string datacenter = 5;
}

message Topology {
  uint64 revision = 1;
  repeated FServer servers = 2;
}

enum DiskHealth {
  DISK_UNKNOWN = 0;
  DISK_HEALTHY = 1;
  DISK_ERROR = 2;
  DISK_STALE = 3;
}

message DiskReport {
  string id = 1;
  string path = 2;
  bool healthy = 3;
  uint64 total_bytes = 4;
  uint64 free_bytes = 5;
  uint64 available_bytes = 6;
  string error = 7;
  DiskHealth health = 8;
  uint64 observed_unix_ms = 9;
}

message ServerStatus {
  string server_id = 1;
  bool online = 2;
  uint64 last_heartbeat_unix_ms = 3;
  repeated DiskReport disks = 4;
  uint64 last_probe_unix_ms = 5;
  string error = 6;
}

message ListRequest {
  // Empty selects all configured servers.
  string server_id = 1;
}
message ListResponse {
  Status status = 1;
  Topology topology = 2;
  repeated ServerStatus servers = 3;
}

message SetServerRequest {
  string id = 1;
  string endpoint = 2;
  bool disabled = 3;
  optional uint64 expected_revision = 4;
  // Omitted preserves an existing server's location.
  optional string datacenter = 5;
}

message SetDiskRequest {
  string server_id = 1;
  Disk disk = 2;
  optional uint64 expected_revision = 3;
}

message SetServerStateRequest {
  // State-only update; preserves the endpoint and disk configuration.
  string id = 1;
  bool disabled = 2;
  optional uint64 expected_revision = 3;
}

message SetDiskStateRequest {
  // State-only update; preserves the disk path and other disk configuration.
  string server_id = 1;
  string disk_id = 2;
  bool disabled = 3;
  optional uint64 expected_revision = 4;
}

message RemoveServerRequest {
  string id = 1;
  optional uint64 expected_revision = 2;
}

message RemoveDiskRequest {
  string server_id = 1;
  string disk_id = 2;
  optional uint64 expected_revision = 3;
}

message ApplyConfigRequest {
  Topology topology = 1;
  optional uint64 expected_revision = 2;
}

message MutationResponse {
  Status status = 1;
  uint64 revision = 2;
}

message ValidateConfigRequest {
  Topology topology = 1;
}

message ValidateConfigResponse {
  Status status = 1;
  // Normalized preview with revision 0; no configuration is persisted.
  Topology topology = 2;
}

message ProbeNowRequest {
  // Empty requests a probe of every configured server.
  string server_id = 1;
}

message ProbeNowResponse {
  Status status = 1;
  // Accepted targets, including probes already in flight. Read List for results.
  uint32 scheduled_servers = 2;
}

message HeartbeatReport {
  string server_id = 1;
  // Configuration revision used to collect these reports.
  uint64 config_revision = 2;
  repeated DiskReport disks = 3;
  // The reporting process's advertised chunk service address.
  string endpoint = 4;
}

message ServerHeartbeatRequest {
  FServer server = 1;
  uint64 config_revision = 2;
}

message ServerHeartbeatResponse {
  Status status = 1;
  HeartbeatReport report = 2;
}

service FServerStatusService {
  rpc Heartbeat(ServerHeartbeatRequest) returns (ServerHeartbeatResponse);
}

service FMasterService {
  rpc List(ListRequest) returns (ListResponse);
  rpc SetServer(SetServerRequest) returns (MutationResponse);
  rpc SetDisk(SetDiskRequest) returns (MutationResponse);
  rpc SetServerState(SetServerStateRequest) returns (MutationResponse);
  rpc SetDiskState(SetDiskStateRequest) returns (MutationResponse);
  rpc RemoveServer(RemoveServerRequest) returns (MutationResponse);
  rpc RemoveDisk(RemoveDiskRequest) returns (MutationResponse);
  rpc ApplyConfig(ApplyConfigRequest) returns (MutationResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc ProbeNow(ProbeNowRequest) returns (ProbeNowResponse);
  rpc CreateSpace(CreateSpaceRequest) returns (SpaceResponse);
  rpc BindPGs(BindPGsRequest) returns (SpaceResponse);
  rpc UnbindPGs(BindPGsRequest) returns (SpaceResponse);
  rpc ListPGPool(ListPGPoolRequest) returns (ListPGPoolResponse);
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  rpc ListPGs(ListPGsRequest) returns (ListPGsResponse);
  rpc AllocateChunks(AllocateChunksRequest) returns (AllocateChunksResponse);
  rpc AllocateBlobs(AllocateBlobsRequest) returns (AllocateBlobsResponse);
  rpc LocateChunk(LocateChunkRequest) returns (LocateChunkResponse);
}

message PlacementPolicy {
  enum Mode {
    SINGLE_DATACENTER = 0;
    BALANCED_DATACENTERS = 1;
    DISTINCT_DATACENTERS = 2;
  }
  Mode mode = 1;
  // Default 1, 2, or replicas according to mode.
  uint32 min_datacenters = 2;
  // Empty permits every eligible datacenter.
  repeated string datacenters = 3;
}
message SpaceSpec {
  uint32 replicas = 1;
  uint64 chunk_size = 2;
  PlacementPolicy placement_policy = 3;
}
message Space {
  string name = 1;
  uint32 id = 2; // Encoded in 8 bits: 0..255.
  SpaceSpec spec = 3;
  uint32 total_pgs = 4; // Fixed GLOBAL namespace: 10,000,000 PGs.
  uint32 bound_pgs = 5; // Number of PGs bound to this Space, not a prefix length.
}
message ReplicaTarget {
  string server_id = 1;
  string endpoint = 2;
  string datacenter = 3;
}
message PlacementGroup {
  uint32 id = 1;
  bool active = 2;
  repeated ReplicaTarget replicas = 3;
}
message ChunkRoute {
  string chunk_id = 1; // 30 hex digits: seq_id:48 | space_id:8 | index:64.
  Space space = 2;
  PlacementGroup pg = 3;
}
message CreateSpaceRequest {
  string name = 1;
  SpaceSpec spec = 2;
  reserved 3; // Creation always binds 200 globally free PGs.
  optional uint64 expected_revision = 4; // Space catalog revision, not topology revision.
}
message BindPGsRequest {
  string name = 1;
  uint32 start = 2; // Global PG ID, inclusive.
  uint32 count = 3;
  optional uint64 expected_revision = 4;
}
message ListPGPoolRequest { uint32 start = 1; uint32 limit = 2; }
message PGOwnership { PlacementGroup pg = 1; string space_name = 2; }
message ListPGPoolResponse {
  Status status = 1;
  uint64 revision = 2;
  uint32 total_pgs = 3;
  uint32 bound_pgs = 4;
  repeated PGOwnership pgs = 5;
  optional uint32 next_start = 6;
}
message SpaceResponse {
  Status status = 1;
  uint64 revision = 2;
  Space space = 3;
}
message ListSpacesRequest { string name = 1; }
message ListSpacesResponse {
  Status status = 1;
  uint64 revision = 2;
  repeated Space spaces = 3;
}
message ListPGsRequest {
  string name = 1;
  uint32 start = 2;
  uint32 limit = 3; // Default 100, maximum 1,000.
  bool include_inactive = 4;
}
message ListPGsResponse {
  Status status = 1;
  uint64 revision = 2;
  Space space = 3;
  repeated PlacementGroup pgs = 4;
  optional uint32 next_start = 5;
}
message AllocateChunksRequest {
  string name = 1;
  uint32 count = 2; // Default 1, maximum 1,024.
  uint64 seq_id = 3; // Required: a Blob sequence allocated in this Space.
  // Inclusive lower bound in hash(index) space; not an index. When omitted,
  // choose a deterministic start distributed across this Space's bound PGs.
  optional uint64 start_cursor = 4;
}
message AllocateChunksResponse {
  Status status = 1;
  uint64 revision = 2;
  repeated ChunkRoute chunks = 3;
  optional uint64 next_cursor = 4; // Missing means the uint64 hash space is exhausted.
}
message Blob {
  uint64 seq_id = 1;
  uint32 space_id = 2;
  // Retain with seq_id for a stable first allocation across new PG bindings.
  uint64 start_cursor = 3;
}
message AllocateBlobsRequest { string name = 1; uint32 count = 2; }
message AllocateBlobsResponse { Status status = 1; uint64 revision = 2; repeated Blob blobs = 3; }
message LocateChunkRequest { string name = 1; string chunk_id = 2; }
message LocateChunkResponse { Status status = 1; uint64 revision = 2; ChunkRoute chunk = 3; }

// Internal durable metadata. An immutable pool per bound global PG range makes
// placement reproducible without materializing ten million PG records.
message PGRange {
  uint32 begin = 1;
  uint32 end = 2;
  repeated ReplicaTarget candidates = 3;
  uint32 algorithm_version = 4;
}
message SpaceState {
  Space space = 1;
  uint64 reserved_sequence = 2; // Version 1 only; never reinterpret old Chunk IDs.
  repeated PGRange ranges = 3;
  repeated BlobSequenceRange blob_sequences = 4;
}
message BlobSequenceRange { uint64 begin = 1; uint64 end = 2; } // Inclusive, durable reservations.
message SpaceCatalog {
  uint64 revision = 1;
  uint64 next_space_id = 2;
  repeated SpaceState spaces = 3;
  uint64 reserved_blob_sequence = 4; // Globally unique Blob sequences across Spaces.
}
